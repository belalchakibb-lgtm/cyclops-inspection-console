<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAC curve – Sonatest Sitescan D-10</title>
<style>
:root{--bg:#0c1420;--panel:#142131;--ink:#e8eef5;--mute:#94a6ba;--acc:#ffb020;--ok:#3ddc84;--line:#243750}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 700px at 30% -10%,#1b2d45 0,var(--bg) 60%);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 10px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;color:var(--mute);border:0;padding:7px 14px;font:600 13px system-ui,sans-serif;cursor:pointer}
.lang button.on{background:var(--acc);color:#1b1300}
main{max-width:1320px;margin:0 auto;padding:0 20px 24px}
.stage{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:940px){.stage{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
#device{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.side{display:flex;flex-direction:column;gap:14px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
#block{width:100%;height:auto;display:block}
.readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px;font-size:12px;color:var(--mute)}
.readout b{display:block;color:var(--ink);font:600 14px ui-monospace,Menlo,Consolas,monospace}
.stepno{color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
#capTitle{margin:4px 0 6px;font-size:21px;line-height:1.2}
#capText{margin:0;font-size:16px;min-height:4.4em}
.hint{margin-top:10px;padding:9px 11px;border-radius:10px;background:#0e1a29;border:1px solid var(--line);font-size:14px;color:#ffd27a;display:flex;gap:8px;align-items:flex-start;min-height:2.9em}
.hint::before{content:"▶";color:var(--acc);font-size:11px;margin-top:3px}
.bar{height:4px;border-radius:4px;background:#0e1a29;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a00,var(--acc))}
.dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dots button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#0e1a29;color:var(--mute);font:700 13px system-ui,sans-serif;cursor:pointer}
.dots button.done{color:var(--ok);border-color:#2a6a48}
.dots button.on{background:var(--acc);color:#1b1300;border-color:var(--acc)}
.ctrl{display:flex;gap:8px;margin-top:12px}
.ctrl button{flex:1;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:#1c2e45;color:var(--ink);font:600 14px system-ui,sans-serif;cursor:pointer}
.ctrl button:hover,.dots button:hover,.lang button:hover{filter:brightness(1.2)}
.ctrl #play{flex:.8;background:#24405f}
.keys{margin-top:8px;font-size:12px;color:var(--mute)}

/* ---------- device SVG ---------- */
.key{transition:transform .07s;transform-box:fill-box;transform-origin:center}
.key .cap{fill:url(#keyG);stroke:#1c1f23;stroke-width:2;transition:fill .08s}
.key .klbl{fill:#eef2f6;font:700 17px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.key .halo{fill:none;stroke:#ffb020;stroke-width:10;opacity:0;filter:url(#blur);transition:opacity .08s}
.key.pressed{transform:scale(.94)}
.key.pressed .cap{fill:#ffb020}
.key.pressed .klbl{fill:#1b1300}
.key.pressed .halo{opacity:.95}
.key.okk .cap{fill:url(#okG)}
.key.okk.pressed .cap{fill:#ffb020}
.cell rect{fill:#0d241d;stroke:#1d4537;stroke-width:1.5}
.cell .clbl{fill:#6f9686;font:700 15px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
.cell .cval{fill:#8fb8a7;font:600 13px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
.cell.active rect{fill:#113428;stroke:#2f7a5d}
.cell.active .clbl{fill:#cfe9de}
.cell.sel rect{fill:#ffb020;stroke:#ffe08a}
.cell.sel .clbl,.cell.sel .cval{fill:#1b1300}
.cval.m-DRAW{fill:#ffb020}.cval.m-ON{fill:#3ddc84}
.cell.sel .cval.m-DRAW,.cell.sel .cval.m-ON{fill:#1b1300}
.grid line{stroke:#1f4436;stroke-width:1}
.grid line.maj{stroke:#2c5c4a}
.scr{font-family:ui-monospace,Menlo,Consolas,monospace}
.axl{fill:#5f8a79;font-size:11px}
.stt{fill:#bfe3d4;font-size:14px;font-weight:600}
#trace{fill:none;stroke:#ffe14d;stroke-width:1.6;stroke-linejoin:round;filter:url(#tglow)}
#curve{fill:none;stroke:#ff3b6b;stroke-width:3;stroke-linecap:round;filter:url(#tglow)}
.pt{fill:#ff3b6b;stroke:#fff;stroke-width:1.5}
.ov{fill:#0a1c16;stroke:#3ddc84;stroke-width:1.5}
.ovt{fill:#3ddc84;font:700 15px ui-monospace,Menlo,Consolas,monospace}
.ovi{fill:#cfe9de;font:600 14px ui-monospace,Menlo,Consolas,monospace}
.ovs{fill:#ffb020}
.ovi.sel{fill:#1b1300}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- block SVG ---------- */
.hole{fill:#0c1420;stroke:#5b6b7c;stroke-width:1}
.hring{fill:none;stroke-width:2.2;opacity:0}
.hring.target{opacity:1;stroke:#ff9500;stroke-width:2.6;stroke-dasharray:5 3;animation:march 1s linear infinite}
.hring.done{opacity:1;stroke:#3ddc84;stroke-dasharray:none;animation:none}
@keyframes march{to{stroke-dashoffset:-16}}
.hlbl{fill:#c9d6e3;font:600 11px system-ui,sans-serif;text-anchor:middle}
.lg{fill:#94a6ba;font:12px system-ui,sans-serif}
</style>
</head>

</main>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const at = (t, x, d = .25) => t >= x && t < x + d;
function track(t, kf) {
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++)
    if (t <= kf[i][0]) return lerp(kf[i - 1][1], kf[i][1], seg(t, kf[i - 1][0], kf[i][0]));
  return kf[kf.length - 1][1];
}

/* ---------------- text ---------------- */
const T = {
  en: {

    step: (n, m) => `Étape ${n} sur ${m}`,
    block: "Bloc de référence à trous génératrices (TG)", cur: "trou en cours", done: "point enregistré",
    probe: "Traducteur", echo: "Écho max", gain: "Gain", none: "pas d’écho", hole: "TG",
    kbd: "← → changer d’étape · Espace pause · lecture en boucle",
    steps: [
      ["Étalonnage", "Étalonnez la base de temps (range), la vitesse, le zéro et l’angle du traducteur."],
      ["Écho de référence à 80 %", "Placez le traducteur sur le trou génératrice le plus proche, maximisez l’écho et réglez-le à 80 % de la hauteur d’écran avec le gain."],
      ["Passer en mode tracé", "Ouvrez MENU > MEAS > DAC et réglez MODE sur DRAW."],
      ["Enregistrer le point 1", "Placez le curseur sur l’écho et appuyez sur OK pour enregistrer le point 1."],
      ["Enregistrer les trous plus profonds", "Passez au trou suivant plus profond, maximisez l’écho sans toucher au gain, placez le curseur dessus et appuyez sur OK. Répétez pour chaque trou, jusqu’à 10 points."],
      ["Afficher la courbe", "Réglez MODE sur ON : la courbe est tracée à travers les points."],

    ],
    h: {
      menuCal: "Appuyez sur MENU pour ouvrir les réglages d’étalonnage",
      cal0: "RANGE : maintenez ▲ jusqu’à 100 mm de parcours",

      toMode: "► passe à MODE",
      draw: "OK, ▼ jusqu’à DRAW, OK",

let lang = "en";

/* ---------------- physics / geometry ---------------- */
// 60° shear-wave probe; side-drilled holes at increasing depth. Amplitudes (A) are at the 46 dB reference gain.
const REF_GAIN = 46, ANG = Math.PI / 3;
const HOLES = [
  { bx: 60, d: 15, A: 80 }, { bx: 100, d: 25, A: 57 },
  { bx: 140, d: 35, A: 40 }, { bx: 180, d: 45, A: 27 }

const PARK = 18;
function echoes(S) {

/* ---------------- step timelines ---------------- */
function preset(k) {

  if (k >= 2) { S.probe = HOLES[0].p; S.gain = REF_GAIN; S.target = 0; }
  if (k >= 3) { S.menu = true; S.meas = "DAC"; S.mode = "DRAW"; S.sel = 2; }
  if (k >= 4) { S.points = 1; S.sel = 3; S.cursor = HOLES[0].s; }
  if (k >= 5) { S.points = 4; S.probe = HOLES[3].p; S.cursor = HOLES[3].s; S.target = 3; }
  if (k >= 6) { S.mode = "ON"; S.curve = 1; S.cursor = null; S.sel = 2; }

const DD_MEAS = ["GATE", "DAC", "TCG", "AWS"], DD_MODE = ["OFF", "DRAW", "ON"];

const STEPS = [
  { dur: 10.5, run(t) { // 1 calibrate
    const S = preset(0);
    if (at(t, .3)) S.keys.push("menu");
    S.hint = ["menuCal"];
    if (t >= .5) S.calOv = { field: 0, done: false };
    const F = [["range", 50, 100], ["vel", 3000, 3240], ["zero", 0, 6.85], ["angle", 45, 60]];
    F.forEach(([name, v0, v1], i) => {
      const a = .9 + i * 2, b = a + 1.4;
      if (i > 0 && t >= a - .45) S.calOv.field = i;
      if (i > 0 && at(t, a - .45)) S.keys.push("down");
      if (t >= (i ? a - .45 : .9)) S.hint = ["cal" + i];
      S.cal[name] = lerp(v0, v1, seg(t, a, b));
      if (t > a && t < b) S.keys.push("up");
    });
    if (at(t, 9)) S.keys.push("ok");
    if (t >= 9) { S.calOv.done = true; S.calOv.field = -1; S.hint = ["calOk"]; }
    return S;
  }},
  { dur: 11, run(t) { // 2 peak + 80 %
    const S = preset(1), p = HOLES[0].p;
    S.target = 0; S.ref80 = true;
    S.probe = track(t, [[0, PARK], [2.4, p + 7], [3.4, p - 5], [4.3, p + 2], [5, p]]);
    if (t > 5.6 && t < 8.4) S.keys.push("gup");
    S.gain = 38 + .5 * Math.min(16, t > 5.6 ? Math.floor((t - 5.6) / 2.8 * 16) + 1 : 0);
    S.hint = t < 5.3 ? ["peak"] : t < 8.6 ? ["gain"] : ["ref"];
    return S;
  }},
  { dur: 7.5, run(t) { // 3 MENU > MEAS > DAC, MODE DRAW
    const S = preset(2);
    if (at(t, .3)) S.keys.push("menu");
    if (t >= .4) { S.menu = true; S.sel = 0; }
    if (at(t, 1.1) || at(t, 2.5) || at(t, 3.9) || at(t, 5.2)) S.keys.push("ok");
    if (at(t, 1.8) || at(t, 4.5)) S.keys.push("down");
    if (at(t, 3.2)) S.keys.push("right");
    if (t >= 1.15 && t < 2.5) S.dd = { tab: 0, items: DD_MEAS, sel: t >= 1.8 ? 1 : 0 };
    if (t >= 2.5) { S.meas = "DAC"; S.sel = 1; }
    if (t >= 3.2) S.sel = 2;
    if (t >= 3.95 && t < 5.2) S.dd = { tab: 2, items: DD_MODE, sel: t >= 4.5 ? 1 : 0 };
    if (t >= 5.2) S.mode = "DRAW";
    S.hint = t < 1.1 ? ["menu"] : t < 3.2 ? ["meas"] : t < 3.9 ? ["toMode"] : t < 5.2 ? ["draw"] : ["drawOn"];
    return S;
  }},
  { dur: 6.5, run(t) { // 4 point 1
    const S = preset(3), h = HOLES[0];
    S.target = 0;
    if (at(t, .3)) S.keys.push("right");
    if (t >= .3) S.sel = 3;
    if (t >= .7) S.cursor = lerp(5, h.s, seg(t, 1, 3.4));
    if (t > 1 && t < 3.4) S.keys.push("right");
    if (at(t, 4)) S.keys.push("ok");
    if (t >= 4) { S.points = 1; S.toast = "POINT 1 STORED"; }
    S.hint = t < .7 ? ["curSel"] : t < 4 ? ["curMove"] : ["pt1"];
    return S;
  }},
  { dur: 19.5, run(t) { // 5 holes 2..4
    const S = preset(4);

    S.probe = track(u, [[0, prev.p], [1.6, h.p + 6], [2.3, h.p - 3], [2.9, h.p]]);
    S.cursor = lerp(prev.s, h.s, seg(u, 3.1, 5));
    if (u > 3.1 && u < 5) S.keys.push("right");
    if (at(u, 5.4)) S.keys.push("ok");
    if (u >= 5.4) S.toast = `POINT ${i + 1} STORED`;

  }},
  { dur: 7, run(t) { // 6 MODE ON

    if (t >= .95 && t < 2.1) S.dd = { tab: 2, items: DD_MODE, sel: t >= 1.5 ? 2 : 1 };

  }},
  { dur: 8, run(t) { // 7 save

    if (t >= 3.25) S.mem = { page: "saving", p: lin(t, 3.3, 4.5) };

  }}
];

function smoothPath(p) {
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++) {

    d += ` C${c1} ${c2} ${p2}`;

  setText("capTitle", st[0]);
  setText("capText", st[1]);
  [...dotsEl.children].forEach((b, i) => {
    b.className = i === step ? "on" : i < step ? "done" : "";
    b.title = L.steps[i][0];
  });
}
function updateLang() {
  const L = T[lang];
  document.documentElement.lang = lang;
  $("lEN").classList.toggle("on", lang === "en");
  $("lFR").classList.toggle("on", lang === "fr");
  setText("hTitle", L.title); setText("hSub", L.sub);
  document.title = `${L.title} – Sonatest Sitescan D-10`;
  setText("bTitle", L.block); setText("lgT", L.cur); setText("lgD", L.done);
  setText("rPL", L.probe); setText("rEL", L.echo); setText("rGL", L.gain);
  setText("prev", L.prev); setText("next", L.next); setText("kbd", L.kbd);
  setText("play", playing ? L.pause : L.play);
  labelHoles();
  updateCaption();
}
function go(i) { step = (i + STEPS.length) % STEPS.length; t = 0; updateCaption(); }
function togglePlay() { playing = !playing; setText("play", playing ? T[lang].pause : T[lang].play); }
$("prev").addEventListener("click", () => go(step - 1));
$("next").addEventListener("click", () => go(step + 1));
$("play").addEventListener("click", togglePlay);
$("lEN").addEventListener("click", () => { lang = "en"; updateLang(); });
$("lFR").addEventListener("click", () => { lang = "fr"; updateLang(); });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(step + 1);
  else if (e.key === "ArrowLeft") go(step - 1);
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
});

function frame(ts) {
  if (last == null) last = ts;
  const dt = Math.min(.1, (ts - last) / 1000);
  last = ts;
  if (playing) {
    t += dt;
    if (t >= STEPS[step].dur) go(step + 1); // after step 7 this wraps to step 1: the lesson loops
  }
  render(STEPS[step].run(t));
  $("prog").style.width = (t / STEPS[step].dur * 100).toFixed(2) + "%";
  requestAnimationFrame(frame);
}
// seek hook (used for testing): __dacSeek(stepIndex, seconds)
window.__dacSeek = (s, tt) => { go(s); t = tt; };
updateLang();
requestAnimationFrame(frame);
})();
</script>
