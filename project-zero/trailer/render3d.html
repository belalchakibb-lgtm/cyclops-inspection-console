const qs = new URLSearchParams(location.search);

// ---------------- procedural textures ----------------

const fires = world.lights.filter(l => l.type === 'Fire').map(l => new THREE.Vector3(...l.p));

// volumetric light shafts under lamps

    zs.horde.forEach((z, i) => { const sp = z.userData.type === 'Fast' ? 1.9 : z.userData.type === 'Heavy' ? 0.7 : 1; place(z, z.position.x || [96, 104, 92, 100, 107, 88, 110, 98, 94, 106][i], 0.12, [200, 192, 186, 178, 205, 212, 184, 222, 230, 236][i] - u * 24 * sp, 0); zwalk(z, t * 4 * sp + i, t, 1, z.userData.type); });
    place(survivor, 99, 0.12, 152 - u * 3, Math.PI); walk(survivor, -t * 3.5, 0.45);
    survivor.userData.R.sh.rotation.x = 1.0; survivor.userData.R.el.rotation.x = 0.4;
    place(survivor2, 104, 0.12, 150 - u * 3, Math.PI); walk(survivor2, -t * 3.5 + 1, 0.45); survivor2.userData.R.sh.rotation.x = 1.1;
    aimFlashlight(V(99.5, 5.7, 153 - u * 3), V(100, 2, 195)); beam.visible = false; flashlight.intensity = 0;
    cam(V(108, 8.5, 130), V(106, 7.2, 138), V(100, 5, 200), V(100, 5.5, 190), u, 56, t, 1.1);
    return { center: V(100, 8, 172), fog: 0.012, rain: true, mist: true, light: V(100, 8, 160) };
  },
  maya(u, t) {
    place(maya, 147, 0.2, 152, Math.PI / 2 - 0.25); idle(maya, t, -0.25 + sm(u * 2) * 0.25);
    const mu = maya.userData; mu.R.sh.rotation.x = 0.9; mu.R.el.rotation.x = 1.2; mu.R.sh.rotation.z = 0.25; mu.L.sh.rotation.x = 0.5; mu.L.el.rotation.x = 1.0;
    mu.chest.rotation.x = 0.04 * Math.sin(t * 2);
    cam(V(136, 6.4, 148.5), V(138.6, 6.1, 150), V(147, 5.8, 152), V(147, 6.1, 152), u, 42, t, 0.7);
    bokeh.uniforms.focus.value = camera.position.distanceTo(V(147, 6, 152));
    return { center: V(148, 14, 152), fog: 0.016, bokeh: true, light: V(148, 14, 152) };
  },
  warden(u, t) {
    const w = zs.warden; const roar = cl((u - 0.15) / 0.3), slam = cl((u - 0.45) / 0.1);
    place(w, 100, 0.1, 266 - Math.min(u, 0.15) * 20 - Math.max(0, u - 0.6) * 12, 0);
    if (u < 0.15 || u > 0.6) zwalk(w, t * 3.2, t, 1, 'Warden');
    else {
      resetPose(w); const wu = w.userData;
      const up = slam > 0 ? 1 - slam : roar;
      wu.L.sh.rotation.x = 2.6 * up + (slam > 0 ? 0.5 * slam : 0); wu.R.sh.rotation.x = 2.6 * up + (slam > 0 ? 0.5 * slam : 0);
      wu.L.sh.rotation.z = -0.5 * up; wu.R.sh.rotation.z = 0.5 * up;
      wu.neck.rotation.x = -0.5 * up; wu.chest.rotation.x = 0.15 * up - 0.5 * slam;
      wu.hips.position.y = 2.9 - 0.6 * slam; wu.LL.kn.rotation.x = -0.8 * slam; wu.RL.kn.rotation.x = -0.8 * slam; wu.LL.hp.rotation.x = 0.4 * slam; wu.RL.hp.rotation.x = 0.4 * slam;
    }
    zs.minions.forEach((z, i) => { place(z, [86, 116][i], 0.1, 276 - u * 12, [0.2, -0.2][i]); zwalk(z, t * 4 + i * 2, t, 1, z.userData.type); });
    place(survivor, 91, 0.1, 247 + (u > 0.55 ? -sm((u - 0.55) / 0.2) * 3 : 0), Math.PI + 0.25); walk(survivor, 0, 0); idle(survivor, t); survivor.userData.R.sh.rotation.x = 1.3;
    place(survivor2, 109, 0.1, 248 + (u > 0.55 ? -sm((u - 0.55) / 0.2) * 3 : 0), Math.PI - 0.25); walk(survivor2, 0, 0); idle(survivor2, t); survivor2.userData.R.sh.rotation.x = 1.3;
    const ru = cl((u - 0.55) / 0.35);
    ring.visible = ru > 0 && ru < 1; ring.scale.setScalar(2 + ru * 26); ring.position.set(w.position.x, 0.3, w.position.z - 3); ring.material.opacity = 1 - ru;
    burst.visible = ru > 0;
    if (ru > 0) { const bp = burst.geometry.attributes.position; for (let i = 0; i < 500; i++) { const a = hash(i) * 6.283, r = (2 + hash(i + 1) * 3 + ru * 22) * (0.6 + hash(i + 2) * 0.4); bp.setXYZ(i, w.position.x + Math.cos(a) * r, 0.5 + hash(i + 3) * 3 * (1 - ru) + ru * 2 * hash(i + 4), w.position.z - 3 + Math.sin(a) * r); } bp.needsUpdate = true; burst.material.opacity = 0.55 * (1 - ru); }
    cam(V(100, 2.4, 232), V(100, 3.2, 238), V(100, 14, 266), V(100, 12, 262), u, 56, t, 1.2);
    if (ru > 0 && ru < 0.25) hit(1.4 * (1 - ru * 4));
    return { center: V(100, 6, 260), fog: 0.012, rain: true, mist: true, light: V(100, 8, 262), flash: ru > 0 && ru < 0.06 ? 0.4 : 0 };
  },
  gate(u, t) {
    for (const s of shutter) { const m = s.base.clone(); m.elements[13] += 9 * sm(u * 1.5); s.mesh.matrix.copy(m); }
    cubeLight.intensity = 60 * sm(u * 1.5); cube.rotation.set(t * 0.7, t * 0.9, 0.3); cube.position.y = 4.5 + Math.sin(t * 2) * 0.25;
    cubeParts.visible = true; const cp = cubeParts.geometry.attributes.position;
    for (let i = 0; i < 300; i++) { const a = hash(i) * 6.283 + t * (0.5 + hash(i + 1)), r = 1.6 + hash(i + 2) * 3 + ((t * 0.6 + hash(i + 3)) % 1) * 2; cp.setXYZ(i, 100 + Math.cos(a) * r, cube.position.y + (hash(i + 4) - 0.5) * 4 + Math.sin(t * 1.5 + i) * 0.4, 307 + Math.sin(a) * r); }
    cp.needsUpdate = true;
    cam(V(100, 5, 272), V(100, 4.6, 299), V(100, 5, 300), V(100, 4.6, 307), u, 52, t, 0.7);
    bokeh.uniforms.focus.value = camera.position.distanceTo(cube.position);
    return { center: V(100, 8, 296), fog: 0.014, bokeh: u > 0.5, light: V(100, 8, 296), dust: true };
  },
  aerial(u, t) {
    for (const s of shutter) s.mesh.matrix.copy(s.base);
    const a = 0.6 + u * 0.45;
    cam(V(60 + Math.cos(a) * 165, 100, 150 + Math.sin(a) * 165), V(60 + Math.cos(a + 0.2) * 150, 88, 150 + Math.sin(a + 0.2) * 150), V(80, 0, 150), V(80, 0, 150), u, 52, t, 0.3);
    return { center: V(90, 10, 140), fog: 0.007, rain: true, light: V(90, 10, 140), dust: false };
  },
};

window.renderFrame = function (shot, u, t) {
  hideAll();
  const info = SHOTS[shot](u, t);
  scene.fog.density = info.fog;
  sun.position.set(info.center.x - 120, 90, info.center.z + 60); sun.target.position.copy(info.center);
  for (const f of flicker) { f.on = Math.sin(t * 13 + f.seed) * Math.sin(t * 5.1 + f.seed * 3) > -0.3; f.mat.color.copy(f.on ? f.base : f.base.clone().multiplyScalar(0.05)); if (f.cone) f.cone.visible = f.on; }
  assignLights(info.light || info.center, t);
  for (const sp of flames) { const { base, i } = sp.userData; const k = (t * 1.7 + i / 8) % 1; sp.position.set(base.x + Math.sin(i * 3 + t * 4) * 0.4, base.y + 0.6 + k * 3.4, base.z + Math.cos(i * 2 + t * 3) * 0.4); sp.scale.setScalar(2.6 * (1 - k) + 0.4); sp.material.opacity = 1 - k; }
  for (const sp of smokes) { const k = (t * 0.25 + sp.userData.i / 16) % 1; sp.position.set(flare.p[0] + k * 6, flare.p[1] + 1 + k * 24, flare.p[2] + k * 2); sp.scale.setScalar(2 + k * 10); sp.material.opacity = 0.4 * (1 - k); }
  updateParticles(t, info.center, info);
  bokeh.enabled = !!info.bokeh;
  grade.uniforms.time.value = t; grade.uniforms.flash.value = info.flash || 0;
  composer.render();
  return renderer.domElement.toDataURL('image/jpeg', 0.94);
};
window.ready = true;
</script>
