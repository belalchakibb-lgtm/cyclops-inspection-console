services:
  - type: web
    name: cyclopsaqcs
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: TRUST_PROXY
        value: "1"
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: AI_MAX_TOKENS
        value: 1200
      - key: AI_TIMEOUT_MS
        value: 45000
      - key: AI_SCOPE
        value: inspection
      - key: CYCLOPS_USERS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
